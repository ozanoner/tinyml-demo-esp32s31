## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version — the ESP-IDF 6.2 development line
  ## (espressif/idf:latest, named in .devcontainer/devcontainer.json).
  idf:
    version: ">=6.2"
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  #
  # Only the components this project's own code uses are declared here. The
  # component manager resolves everything below them on its own — including the
  # BSP's whole subtree (esp_lvgl_port, esp_video, esp_codec_dev, …). Listing the
  # secondary dependencies, the ones only reached transitively, just makes the
  # graph harder to read and blurs who owns which version.
  #
  # The BSP itself is owned by the selected devkit: see devkits/<devkit>/idf_component.yml.
  #
  # These three are held at the exact versions this app was built and tested
  # against (issue #27). esp-dl 3.3.13 strips ops at compile time to whatever the
  # registered req files name — only esp-sr registers one (speech ops), so the
  # coco_detect model's Swish op was compiled out, Model::load() failed and
  # Detector init panicked on every boot. coco_detect 0.4.1 declares esp-dl
  # ~3.3.13 and esp-sr 2.6.0 declares esp-dl ~3.3.12, so esp-dl cannot be
  # reverted on its own: the three move together. coco_detect 0.4.0/0.4.1 ship
  # identical sources and an identical p4 model — only the esp-dl range differs.
  espressif/esp-sr: "2.4.7"
  espressif/esp-dl: "3.3.8"
  espressif/coco_detect: "0.4.0"
  #
  # main/ includes lvgl.h directly (app_main.cpp, splash.hpp, state_display.hpp,
  # result_display.cpp), so the version is named here instead of being left to
  # the BSP's ranges. One project resolves ONE lvgl, and both devkits constrain
  # it: esp_lvgl_port declares '>=8,<10', while the ESP-Mosaico BSP (issue #35)
  # declares '^9.5.0,<9.6.0' for its esp_lvgl_adapter path. The pin therefore
  # has to sit in the intersection, and 9.5.0 is the only version the registry
  # publishes there — 9.6.0 and 9.6.0~1 are above the range, and no other 9.5.x
  # exists. Exact, not a range ('~N' is the revision field).
  lvgl/lvgl: "9.5.0"

# ---- Cross-devkit override ---------------------------------------------------
# Both devkit directories are always in the build (see the top-level
# CMakeLists.txt), so ONE dependency solution has to satisfy both BSPs, and —
# because the component manager hands every managed component back to the build
# (tools/cmake/build.cmake:732 appends them to the list COMPONENTS trims at
# :767-769) — both devkits' components are compiled in every build. The version
# set therefore has to satisfy both devkits' *code*, not just their ranges.
#
# Two components declare disjoint ranges, so the solver has no version to pick:
#
#   esp_video      Korvo BSP 1.0.1 wants ~2.2 (2.2.0 is the only one)
#                  ESP-Mosaico camera module wants ^2.4.1
#   esp_codec_dev  Korvo BSP 1.0.1 wants ~1.5 (… through 1.5.11)
#                  ESP-Mosaico BSP wants ~1.6
#
# `overrides` is the documented way to force a transitive dependency, and it
# replaces the requirement rather than adding to it. Each was decided on
# evidence, not preference:
#
#   esp_video      held at the Korvo side: 2.2.0 is the version this
#                  application's capture path was built, flashed and verified
#                  against (issues #36/#38). The ESP-Mosaico camera module
#                  shares that version's DVP configuration struct,
#                  VIDIOC_S_DQBUF_TIMEOUT ioctl and device name unchanged.
#   esp_codec_dev  goes to the ESP-Mosaico side: the Mosaico BSP calls
#                  audio_codec_i2c_cfg_t.clock_speed_hz, a 1.6 field, so it does
#                  not compile against 1.5.11
#                  (esp-mosaico-bsp/onboard/audio.c:83). 1.6 is additive for the
#                  Korvo side — the whole public-header delta is that member plus
#                  one get_info callback.
#
# Only one manifest in a project may declare `overrides` — it lives here, next
# to the other exact pins, each entry naming the canonical component name.
overrides:
  - espressif/esp_video:
      with:
        espressif/esp_video:
          version: "2.2.0"
      reason: "Korvo BSP pins ~2.2, the ESP-Mosaico camera module ^2.4.1; 2.2.0 is the version the capture path was verified against, and the Mosaico camera module shares its DVP API unchanged"
  - espressif/esp_codec_dev:
      with:
        espressif/esp_codec_dev:
          version: "1.6.2"
      reason: "Korvo BSP pins ~1.5, the ESP-Mosaico BSP ~1.6 and calls audio_codec_i2c_cfg_t.clock_speed_hz, a 1.6 field (esp-mosaico-bsp/onboard/audio.c:83), so 1.5.11 cannot compile; 1.6 only adds that member and a get_info callback"
