name: build

# Builds both devkits and, on a tag, ships the images with the release.
# workflow_dispatch runs the same build without touching a release — that is the
# manual test path.
#
# On a tag it first checks that the architecture diagrams were stamped for *this*
# tag. The expensive half of the diagram gate — re-resolving every cited
# `path:line` with archify and running the visual check — happens once, on the
# machine that regenerates the diagrams in the pre-release commit; the release only
# needs to know the artefacts it is shipping were stamped for this exact tag.
# Nothing here ever writes a diagram back.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned by digest, not tag: `espressif/idf:latest` is a moving v6.1-dev build,
  # so a release built tomorrow would not be the compiler that built the tested
  # image. Version string behind this digest: ESP-IDF v6.1-dev-8440-gab95e70748f.
  IDF_IMAGE: espressif/idf@sha256:6ad927cfb85a5fea82da64b00960b01adff4fc6019ffcdb18caa3da642d55343

jobs:
  preflight:
    name: check the diagrams are stamped for this tag
    # Release precondition only. On workflow_dispatch this job is skipped and the
    # build below runs regardless — see its `if:`.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      # History is needed to place the stamped commit relative to the tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare the stamp with the tag being released
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          commit=""
          for f in docs/architecture/architecture.html docs/architecture/runtime.html; do
            line="$(grep -oE '<!-- release: [^ ]+ @ [0-9a-f]{7,40} -->' "$f" || true)"
            if test -z "$line"; then
              echo "::error::$f carries no release stamp — refresh and stamp the diagrams in a pre-release commit"
              exit 1
            fi
            ftag="$(sed -E 's/.*release: ([^ ]+) @.*/\1/' <<<"$line")"
            fcommit="$(sed -E 's/.* @ ([0-9a-f]{7,40}) -->/\1/' <<<"$line")"
            echo "$f: stamped $ftag @ $fcommit"
            if test "$ftag" != "$tag"; then
              echo "::error::$f is stamped for $ftag but this run is $tag — stamp the diagrams for this release"
              exit 1
            fi
            if test -n "$commit" && test "$commit" != "$fcommit"; then
              echo "::error::the two diagrams record different commits ($commit, $fcommit)"
              exit 1
            fi
            commit="$fcommit"
          done

          # The stamp says which commit the citations were validated against. If the
          # tag has moved on from it, the diagrams no longer describe the code.
          git cat-file -e "${commit}^{commit}" \
            || { echo "::error::stamped commit $commit is not in this history"; exit 1; }
          git merge-base --is-ancestor "$commit" "$GITHUB_SHA" \
            || { echo "::error::stamped commit $commit is not an ancestor of the tag"; exit 1; }
          changed="$(git diff --name-only "$commit" "$GITHUB_SHA" -- . ":(exclude)docs/architecture")"
          if test -n "$changed"; then
            echo "::error::code moved since the diagrams were stamped — refresh them for this tag"
            echo "$changed"
            exit 1
          fi
          echo "diagrams match $tag; code unchanged since $commit"

  build:
    name: build (${{ matrix.devkit }})
    runs-on: ubuntu-latest
    # `preflight` only runs on a tag, and a skipped dependency must not skip the
    # build on a manual run.
    needs: preflight
    if: always() && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        devkit: [korvo1, mosaico]

    steps:
      - uses: actions/checkout@v4

      # The component graph is pinned by the committed dependencies.lock, so the
      # cache key changes only when that graph changes.
      - name: Restore the component cache
        uses: actions/cache@v4
        with:
          path: managed_components
          key: components-${{ runner.os }}-${{ hashFiles('dependencies.lock') }}
          restore-keys: components-${{ runner.os }}-

      - name: Pull the pinned toolchain
        run: docker pull "$IDF_IMAGE"

      - name: Build
        run: |
          docker run --rm -v "$PWD":/project -w /project "$IDF_IMAGE" bash -lc '
            set -e
            . /opt/esp/idf/export.sh >/dev/null
            idf.py --preset ${{ matrix.devkit }} build
            idf.py --preset ${{ matrix.devkit }} size
            idf.py --preset ${{ matrix.devkit }} merge-bin -o merged-${{ matrix.devkit }}.bin
          '

      # Guards the layout the docs promise: the detection model must be its own
      # partition and must not be back inside the app image (issue #69).
      - name: Check the flash layout
        run: |
          set -euo pipefail
          b="build/${{ matrix.devkit }}"
          echo "--- flash_args"; cat "$b/flash_args"
          grep -q '0xc10000 espdl_models/coco_detect.espdl' "$b/flash_args" \
            || { echo "::error::coco_det is not flashed from its own partition"; exit 1; }
          grep -q 'tinyml-demo-esp32s31.bin' "$b/flash_args" \
            || { echo "::error::app image missing from flash_args"; exit 1; }
          grep -qx '0x10000 tinyml-demo-esp32s31.bin' "$b/flash_app_args" \
            || { echo "::error::app-flash must write the app partition only"; exit 1; }
          if test -n "$(grep -E 'coco_detect|srmodels' "$b/flash_app_args")"; then
            echo "::error::app-flash must not write the model partitions"; exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          devkit='${{ matrix.devkit }}'
          b="build/$devkit"
          d="dist"; mkdir -p "$d"
          cp "$b/bootloader/bootloader.bin"           "$d/bootloader-$devkit.bin"
          cp "$b/partition_table/partition-table.bin" "$d/partition-table-$devkit.bin"
          cp "$b/ota_data_initial.bin"                "$d/ota_data_initial-$devkit.bin"
          cp "$b/srmodels/srmodels.bin"               "$d/srmodels-$devkit.bin"
          cp "$b/espdl_models/coco_detect.espdl"      "$d/coco_detect-$devkit.espdl"
          cp "$b/tinyml-demo-esp32s31.bin"            "$d/app-$devkit.bin"
          cp "$b/merged-$devkit.bin"                  "$d/merged-$devkit.bin"
          cp "$b/flash_args"                          "$d/flash_args-$devkit.txt"
          ( cd "$d" && sha256sum bootloader-$devkit.bin partition-table-$devkit.bin \
              ota_data_initial-$devkit.bin srmodels-$devkit.bin coco_detect-$devkit.espdl \
              app-$devkit.bin merged-$devkit.bin > "SHA256SUMS-$devkit.txt" )
          echo "--- $devkit"; ls -l "$d"/*"$devkit"*; cat "$d/SHA256SUMS-$devkit.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: tinyml-demo-${{ matrix.devkit }}
          path: dist
          if-no-files-found: error

  release:
    name: attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tinyml-demo-*
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh has no git context to infer the repo from.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber
          echo "--- assets on $tag"
          gh release view "$tag" --json assets --jq '.assets[].name'
